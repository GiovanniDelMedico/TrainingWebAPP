<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script type="text/javascript">
      // Ottieni il path originale
      var redirect = window.location.pathname;

      // Rimuovi la parte del repo se serve
      // (es. /TrainingWebAPP/about → /about)
      var repoName = "/TrainingWebAPP";
      if (redirect.startsWith(repoName)) {
        redirect = redirect.substring(repoName.length);
      }

      // Reindirizza a index.html mantenendo la route
      window.location.replace(repoName + "/index.html#" + redirect);
    </script>
  </head>
  <body>
  </body>
</html>
